# Bundle registry: a name -> the skills, agents and rules it installs.
# A config's own templates/bundles.yaml replaces this file entirely.
#
#   skills / agents / rules  names from the source namespace
#   requires                 var paths validate checks before rendering
#   sessionContext           file under .claude/skills/ printed at session start

ship:
  skills: [ship]
  agents: [gatekeeper]
  rules: [repo-stance]
  requires: [company, lang, reviewers, branch, gates, tracker.kind]
  sessionContext: ship/session-context.md
